name: Apple builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apple-build.yml"
      - "ios/**"
      - "macos/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  pull_request:
    paths:
      - ".github/workflows/apple-build.yml"
      - "ios/**"
      - "macos/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze lib test integration_test tool

      - name: Test
        run: flutter test

      - name: Build macOS release
        run: flutter build macos --release

      - name: Build iOS simulator app
        run: flutter build ios --simulator
