name: macOS signed release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Tag, branch, or commit to build
        required: true
        default: main

permissions:
  contents: read

jobs:
  sign-notarize:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Require signing credentials
        shell: bash
        run: |
          set -euo pipefail
          required=(
            MACOS_CERTIFICATE_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_SIGNING_IDENTITY
            APPLE_API_KEY_BASE64
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Analyze and test
        run: |
          flutter pub get
          dart analyze lib test integration_test tool
          flutter test

      - name: Build macOS release
        run: flutter build macos --release

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Sign, notarize, and verify
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/macos/Build/Products/Release/购物守护者.app"
          ZIP_PATH="$RUNNER_TEMP/shopping-guardian-macos-signed.zip"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" \
            > "$RUNNER_TEMP/signed-entitlements.plist"
          plutil -extract com.apple.security.app-sandbox raw \
            "$RUNNER_TEMP/signed-entitlements.plist"
          plutil -extract com.apple.security.network.client raw \
            "$RUNNER_TEMP/signed-entitlements.plist"

          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          xcrun notarytool submit "$ZIP_PATH" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

          rm -f "$API_KEY_PATH" "$ZIP_PATH"
          ditto -c -k --keepParent "$APP_PATH" shopping-guardian-macos-signed.zip
          shasum -a 256 shopping-guardian-macos-signed.zip \
            > shopping-guardian-macos-signed.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: shopping-guardian-macos-signed
          path: |
            shopping-guardian-macos-signed.zip
            shopping-guardian-macos-signed.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/developer-id.p12"
          security delete-keychain \
            "$RUNNER_TEMP/release-signing.keychain-db" || true
